[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "booking-operations-pipeline"
version = "0.1.0"
description = "Starter kit for the Indie Campers data engineering challenge"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
booking-pipeline = "booking_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
